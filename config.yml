# Sensor Telemetry Services configuration

# Logging (debug, error, warn, info)
logLevel: debug

# API server port
apiPort: 3301

# MQTT broker connection
mqttBrokerIpAddress: 10.10.10.64
mqttTopicTelemetry: iot/v3/telemetry
mqttTopicLog: iot/v3/log
mqttTopicHealth: iot/v3/health

# Optional: Prometheus source label sanitization
sensorSourceMaxLength: 30
sensorSourceValidCharsRegex: a-zA-Z0-9._-

# Forward sensor logs to application logger
forwardSensorLogs: true
forwardSensorLogsLevel: info
