# Sensor Telemetry Services configuration

# Logging (debug, error, warn, info)
logLevel: debug

# API server port
apiPort: 3301

# MQTT broker connection
mqttBrokerIpAddress: 10.10.10.64
mqttTopicTelemetry: iot/v3/telemetry
mqttTopicLog: iot/v3/log
mqttTopicHealth: iot/v3/health

# Optional: Prometheus source label sanitization
sensorSourceMaxLength: 30
sensorSourceValidCharsRegex: a-zA-Z0-9._-
# Optional: max distinct source / firmware_version label values admitted as
# Prometheus labels (values beyond the cap map to a fallback label)
sensorSourceCardinalityCap: 1024

# Optional: inactivity threshold in seconds after which a source's per-source
# data gauges are removed (sensor_last_seen_timestamp_seconds is retained as
# the staleness signal). 0 disables removal entirely. Keep well above the
# longest expected sensor reporting interval to avoid flapping.
staleSourceRemovalSecs: 60

# Forward sensor logs to application logger
forwardSensorLogs: true
forwardSensorLogsLevel: info
