# Explicit project name: the compose file lives in code/, so the default
# (directory-based) project name would be "code" — a name shared by every
# repo in this workspace that uses a code/ layout, which cross-mixes orphan
# containers and makes `docker compose down` stop matching this service's
# containers from other directories.
name: sensor-telemetry

services:
  sensor-telemetry:
    build:
      context: .
      dockerfile: Dockerfile
    # Stable image name: without it, compose derives <project>-<service>,
    # which changes whenever the project name does (the manual build in the
    # README tags the image sensor-telemetry).
    image: sensor-telemetry
    container_name: sensor-telemetry
    # Internal API port — must match config.yml's `apiPort` (the app's source
    # of truth) and the Dockerfile EXPOSE/HEALTHCHECK. Change all three
    # together, or the host port stops reaching the service and the
    # healthcheck fails. Intentional, documented constraint (see the repo's
    # docs/CONFIGURATION.md), not a bug.
    ports:
      - "32002:32002"
    volumes:
      - /mnt/sensor-telemetry:/app/configs:rw
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      # Shared secret protecting /write-config and /reload-config. Sourced
      # from the local .env file (git-ignored — never commit it). When unset
      # the config endpoints stay open and the service logs a warning at
      # startup; set it in .env to enable the x-config-token check.
      - SENSOR_TELEMETRY_CONFIG_TOKEN=${SENSOR_TELEMETRY_CONFIG_TOKEN}
      # Browser origins allowed to call the HTTP API cross-origin
      # (comma-separated, exact scheme://host:port matches). Omit or set to
      # * to allow all origins, the previous default. Does not replace
      # SENSOR_TELEMETRY_CONFIG_TOKEN authentication.
      - SENSOR_TELEMETRY_CORS_ORIGINS=http://10.10.10.50:3000
      # /restart-service opt-in (POST /restart-service with the
      # x-restart-token header). DISABLED BY DEFAULT: set
      # SENSOR_TELEMETRY_RESTART_ENABLED=true in code/.env together with a
      # strong, distinct SENSOR_TELEMETRY_RESTART_TOKEN to enable it. The
      # service refuses to start when the flag is true and the token is
      # absent (fail-fast — an unauthenticated restart endpoint would be an
      # instant denial-of-service). An accepted restart schedules the
      # existing graceful SIGTERM shutdown; the restart: unless-stopped
      # policy above then starts the same container again. See
      # docs/CONFIGURATION.md and docs/DECISIONS.md.
      - SENSOR_TELEMETRY_RESTART_ENABLED=${SENSOR_TELEMETRY_RESTART_ENABLED:-false}
      # Empty when unset in .env — the app treats an empty token as absent
      # (never a usable sentinel).
      - SENSOR_TELEMETRY_RESTART_TOKEN=${SENSOR_TELEMETRY_RESTART_TOKEN}
