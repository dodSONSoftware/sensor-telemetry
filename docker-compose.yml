services:
  sensor-telemetry:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sensor-telemetry
    ports:
      - "3301:3301"
    volumes:
      - /mnt/sensor-telemetry/config.yml:/app/configs/config.yml:ro
    restart: unless-stopped
    environment:
      - NODE_ENV=production
